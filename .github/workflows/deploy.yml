name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Cache-bust assets with hashed filenames
        run: |
          VER=${GITHUB_SHA::7}
          cp app.js "app.$VER.js"
          cp styles.css "styles.$VER.css"
          sed -i "s|app\.js?v=__VER__|app.$VER.js|g; s|styles\.css?v=__VER__|styles.$VER.css|g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
